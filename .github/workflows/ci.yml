name: GateClaw CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun typecheck

      - name: Test (opencode package)
        run: cd packages/opencode && bun test

      - name: Test (gateclaw-orchestrator package)
        run: cd packages/gateclaw-orchestrator && bun test

      - name: Test (app package)
        run: cd packages/app && bun test --preload ./happydom.ts
