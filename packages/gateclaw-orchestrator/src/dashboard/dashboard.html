<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateClaw Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: #27272a;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #52525b;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background: #71717a;
      }
      .log-live {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }
      .toggle-switch {
        position: relative;
        width: 44px;
        height: 24px;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: #3f3f46;
        border-radius: 24px;
        transition: 0.3s;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: 0.3s;
      }
      input:checked + .toggle-slider {
        background-color: #10b981;
      }
      input:checked + .toggle-slider:before {
        transform: translateX(20px);
      }
      .light-mode {
        background: #f4f4f5 !important;
        color: #18181b !important;
      }
      .light-mode .bg-zinc-900 {
        background: #e4e4e7 !important;
      }
      .light-mode .bg-zinc-950 {
        background: #f4f4f5 !important;
      }
      .light-mode .border-zinc-800 {
        border-color: #d4d4d8 !important;
      }
      .light-mode .text-zinc-100 {
        color: #18181b !important;
      }
      .light-mode .text-zinc-400 {
        color: #52525b !important;
      }
      .light-mode .text-zinc-500 {
        color: #71717a !important;
      }
      @media (max-width: 768px) {
        .mobile-tabs {
          display: none;
        }
        .mobile-menu {
          display: block !important;
        }
      }
      @media (min-width: 769px) {
        .mobile-menu {
          display: none !important;
        }
      }
    </style>
  </head>

      let chatMessages = []

        health: true,

        messages: false,

        config: false,
        plugins: false,
        voice: false,
        settings: false,
        soulPresets: false,
        telegramLogs: false,
        sessions: false,
        metrics: false,
        errors: false,
        activities: false,

        providers: false,
      }

      // Utils
      function formatUptime(ms) {
        const seconds = Math.floor(ms / 1000)
        const minutes = Math.floor(seconds / 60)
        const hours = Math.floor(minutes / 60)
        const days = Math.floor(hours / 24)
        if (days > 0) return days + "d " + (hours % 24) + "h"
        if (hours > 0) return hours + "h " + (minutes % 60) + "m"
        if (minutes > 0) return minutes + "m " + (seconds % 60) + "s"
        return seconds + "s"
      }

      function formatDate(ts) {
        return new Date(ts).toLocaleString()
      }
      function formatRelativeTime(ts) {
        const now = Date.now()
        const diff = now - ts
        const minutes = Math.floor(diff / 60000)
        const hours = Math.floor(diff / 3600000)
        const days = Math.floor(diff / 86400000)
        if (days > 0) return days + " days ago"
        if (hours > 0) return hours + "h ago"
        if (minutes > 0) return minutes + "m ago"
        return "just now"
      }
      function formatBytes(bytes) {
        if (bytes < 1024) return bytes + " B"
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB"
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB"
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + " GB"
      }
      function escapeHtml(str) {
        const div = document.createElement("div")
        div.textContent = str
        return div.innerHTML
      }

      // Theme toggle
      function toggleTheme() {
        const body = document.getElementById("body")
        body.classList.toggle("light-mode")
        const isLight = body.classList.contains("light-mode")
        saveSettings({ ...settings, theme: isLight ? "light" : "dark" })
      }

      function applyTheme() {
        const body = document.getElementById("body")
        if (settings?.theme === "light") {
          body.classList.add("light-mode")
        } else {
          body.classList.remove("light-mode")
        }
      }

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return
        const tabs = [
          "overview",
          "health",
          "chat",
          "memory",
          "logs",
          "telegram",
          "sessions",
          "plugins",
          "voice",
          "config",
          "soul",
          "settings",
          "activity",
        ]
        if (e.key === "j") {
          const idx = tabs.indexOf(activeTab)
          if (idx < tabs.length - 1) switchTab(tabs[idx + 1])
        }
        if (e.key === "k") {
          const idx = tabs.indexOf(activeTab)
          if (idx > 0) switchTab(tabs[idx - 1])
        }
        if (e.key === "r") {
          if (activeTab === "overview") {
            fetchHealth()
            fetchMetrics()
            fetchRecentErrors()
          }
          if (activeTab === "health") {
            fetchHealthChecks()
            fetchSystemStats()
          }
          if (activeTab === "chat") {
            fetchChatHistory()
          }
          if (activeTab === "memory") fetchFacts()
          if (activeTab === "logs") fetchLogs()
          if (activeTab === "telegram") fetchTelegramLogs()
          if (activeTab === "sessions") fetchSessions()
          if (activeTab === "activity") fetchActivities()
        }
        if (e.key === "/") {
          e.preventDefault()
          const searchInput = document.getElementById("memorySearch")
          if (searchInput) searchInput.focus()
        }
      })

      // API calls
      async function fetchHealth() {
        loading.health = true
        render()
        try {
          const res = await fetch(GC_API + "/health")
          health = await res.json()
        } catch (e) {
          health = { status: "error", error: e.message }
        }
        loading.health = false
        render()
      }

      async function fetchTelegramStatus() {
        loading.telegram = true
        render()
        try {
          const res = await fetch(GC_API + "/telegram/status")
          telegramStatus = await res.json()
        } catch (e) {
          telegramStatus = { configured: false, running: false }
        }
        loading.telegram = false
        render()
      }

      async function fetchFacts() {
        loading.facts = true
        render()
        try {
          const res = await fetch(GC_API + "/facts")
          facts = await res.json()
        } catch (e) {
          facts = []
        }
        loading.facts = false
        render()
      }

      async function fetchHealthChecks() {
        loading.checks = true
        render()
        try {
          const res = await fetch(GC_API + "/health/checks")
          healthChecks = await res.json()
        } catch (e) {
          healthChecks = { error: e.message }
        }
        loading.checks = false
        render()
      }

      async function fetchSystemStats() {
        loading.stats = true
        render()
        try {
          const res = await fetch(GC_API + "/system/stats")
          systemStats = await res.json()
        } catch (e) {
          systemStats = { error: e.message }
        }
        loading.stats = false
        render()
      }

      async function fetchLogs(limit = 100) {
        loading.logs = true
        render()
        try {
          const res = await fetch(GC_API + "/logs?limit=" + limit)
          const data = await res.json()
          logs = data.lines || []
        } catch (e) {
          logs = ["Error loading logs: " + e.message]
        }
        loading.logs = false
        render()
      }

      async function fetchMessages(limit = 50) {
        loading.messages = true
        render()
        try {
          const res = await fetch(GC_API + "/messages?limit=" + limit)
          const data = await res.json()
          messages = data.messages || []
        } catch (e) {
          messages = []
        }
        loading.messages = false
        render()
      }

      async function fetchConfig(file) {
        loading.config = true
        render()
        try {
          const res = await fetch(GC_API + "/config/" + encodeURIComponent(file))
          config[file] = await res.json()
        } catch (e) {
          config[file] = { error: e.message }
        }
        loading.config = false
        render()
      }

      async function saveFact(key, value) {
        await fetch(GC_API + "/fact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key, value }),
        })
        await fetchFacts()
      }

      async function deleteFact(key) {
        if (!confirm('Delete fact "' + key + '"?')) return
        await fetch(GC_API + "/fact/" + encodeURIComponent(key), { method: "DELETE" })
        await fetchFacts()
      }

      async function clearHistory() {
        if (!confirm("Clear all conversation history? This cannot be undone.")) return
        await fetch(GC_API + "/messages", { method: "DELETE" })
        await fetchMessages()
      }

      async function reloadSoul() {
        try {
          const res = await fetch(GC_API + "/soul/reload", { method: "POST" })
          const data = await res.json()
          alert(data.success ? "Soul reloaded!" : "Error: " + data.error)
        } catch (e) {
          alert("Error: " + e.message)
        }
      }

      async function fetchPlugins() {
        loading.plugins = true
        render()
        try {
          const res = await fetch(GC_API + "/plugins")
          const data = await res.json()
          plugins = data.plugins || []
        } catch (e) {
          plugins = []
        }
        loading.plugins = false
        render()
      }

      async function togglePlugin(id, enable) {
        await fetch(GC_API + "/plugins/" + id + "/" + (enable ? "enable" : "disable"), { method: "POST" })
        await fetchPlugins()
      }

      async function fetchVoiceStatus() {
        loading.voice = true
        render()
        try {
          const res = await fetch(GC_API + "/voice/status")
          voiceStatus = await res.json()
        } catch (e) {
          voiceStatus = { error: e.message }
        }
        loading.voice = false
        render()
      }

      async function fetchSettings() {
        loading.settings = true
        render()
        try {
          const res = await fetch(GC_API + "/settings")
          settings = await res.json()
          applyTheme()
        } catch (e) {
          settings = {}
        }
        loading.settings = false
        render()
      }

      async function saveSettings(newSettings) {
        try {
          const res = await fetch(GC_API + "/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newSettings),
          })
          settings = await res.json()
          applyTheme()
          render()
        } catch (e) {
          alert("Error saving settings: " + e.message)
        }
      }

      async function fetchSoulPresets() {
        loading.soulPresets = true
        render()
        try {
          const res = await fetch(GC_API + "/soul/presets")
          const data = await res.json()
          soulPresets = data.presets || []
        } catch (e) {
          soulPresets = []
        }
        loading.soulPresets = false
        render()
      }

      async function setSoulPreset(id) {
        try {
          await fetch(GC_API + "/soul/preset/" + id, { method: "POST" })
          await reloadSoul()
        } catch (e) {
          alert("Error: " + e.message)
        }
      }

      async function fetchTelegramLogs(limit = 100) {
        const container = document.getElementById("telegramLogContainer")
        const wasAtBottom = container
          ? container.scrollHeight - container.scrollTop <= container.clientHeight + 50
          : true

        loading.telegramLogs = true
        render()
        try {
          const res = await fetch(GC_API + "/telegram/logs?limit=" + limit)
          const data = await res.json()
          telegramLogs = data.logs || []
        } catch (e) {
          telegramLogs = []
        }
        loading.telegramLogs = false
        render()

        if (wasAtBottom) {
          setTimeout(() => {
            const newContainer = document.getElementById("telegramLogContainer")
            if (newContainer) newContainer.scrollTop = newContainer.scrollHeight
          }, 10)
        }
      }

      async function clearTelegramLogs() {
        if (!confirm("Clear all Telegram logs?")) return
        await fetch(GC_API + "/telegram/logs", { method: "DELETE" })
        telegramLogs = []
        render()
      }

      async function saveConfigFile(file) {
        try {
          await fetch(GC_API + "/config/" + encodeURIComponent(file), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: configContent }),
          })
          editingConfig = null
          await fetchConfig(file)
          alert("Config saved!")
        } catch (e) {
          alert("Error saving: " + e.message)
        }
      }

      async function startTelegramBot() {
        await fetch(GC_API + "/telegram/start", { method: "POST" })
        await fetchTelegramStatus()
        startTelegramLiveLogs()
      }

      async function stopTelegramBot() {
        await fetch(GC_API + "/telegram/stop", { method: "POST" })
        await fetchTelegramStatus()
        stopTelegramLiveLogs()
      }

      let telegramLiveInterval = null

      function startTelegramLiveLogs() {
        if (telegramLiveInterval) return

      function startStt() {
        if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
          chatError = "Speech recognition not supported in this browser"
          render()
          return
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
        chatRecognition = new SpeechRecognition()
        chatRecognition.continuous = true
        chatRecognition.interimResults = true
        chatRecognition.onresult = (event) => {
          let finalTranscript = ""
          let interimTranscript = ""
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript
            if (event.results[i].isFinal) {
              finalTranscript += transcript
            } else {
              interimTranscript += transcript
            }
          }
          const input = document.getElementById("chatInput")
          if (input) {
            input.value = chatInput + finalTranscript + interimTranscript
            chatInput = input.value
          }
        }
        chatRecognition.onerror = (event) => {
          if (event.error !== "no-speech") {
            chatError = "STT error: " + event.error
            render()
          }
        }
        chatRecognition.onend = () => {
          if (chatSttEnabled && chatRecognition) {
            try {
              chatRecognition.start()
            } catch (e) {}
          }
        }
        try {
          chatRecognition.start()
        } catch (e) {
          chatError = "Failed to start STT: " + e.message
          render()
        }
      }

      function stopStt() {
        if (chatRecognition) {
          try {
            chatRecognition.stop()
          } catch (e) {}
          chatRecognition = null
        }
      }

      async function sendChatMessage() {
        if (!chatInput.trim() || chatLoading) return
        const text = chatInput
        chatInput = ""
        chatLoading = true
        chatError = null
        render()

        // Add user message immediately
        chatMessages.push({ role: "user", content: text, timestamp: Date.now() })
        render()

        try {
          // Ensure session exists
          if (!chatSession) {
            await fetchChatSession()
          }

          if (!chatSession) {
            throw new Error("No session available")
          }

          // Send message
          const sendRes = await fetch(GC_API + "/chat/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              sessionId: chatSession.id,
              text,
              agent: selectedAgent || "default",
              provider: selectedChatProvider || undefined,
              model: selectedChatModel || undefined,
            }),
          })
          const sendData = await sendRes.json()
          if (sendData.error) {
            chatError = typeof sendData.error === "object" ? JSON.stringify(sendData.error) : sendData.error
            chatLoading = false
            render()
            return
          }

          // Listen for SSE events for streaming response
          eventSource = new EventSource(GC_API + "/chat/events")

          eventSource.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data)
              if (data.type === "error") {
                chatError = data.error
                chatLoading = false
                eventSource.close()
                eventSource = null
                render()
              }
              // Handle streaming message parts
              if (data.type === "message" || data.type === "content" || data.type === "text") {
                // Update last assistant message or add new one
                const lastMsg = chatMessages[chatMessages.length - 1]
                if (lastMsg && lastMsg.role === "assistant") {
                  lastMsg.content += data.content || data.text || ""
                } else {
                  chatMessages.push({
                    role: "assistant",
                    content: data.content || data.text || "",
                    timestamp: Date.now(),
                  })
                }
                render()
              }
              // Message complete
              if (data.type === "done" || data.type === "complete") {
                chatLoading = false
                eventSource.close()
                eventSource = null
                render()
              }
            } catch (e) {
              // Ignore parse errors
            }
          }

          eventSource.onerror = () => {
            // SSE connection closed - check final state
            chatLoading = false
            if (eventSource) {
              eventSource.close()
              eventSource = null
            }
            // Refresh messages to get final state
            fetchChatHistory()
            render()
          }

          // Timeout after 2 minutes
          setTimeout(() => {
            if (chatLoading && eventSource) {
              chatError = "Response timeout"
              chatLoading = false
              eventSource.close()
              eventSource = null
              render()
            }
          }, 120000)
        } catch (e) {
          chatError = e.message
          chatLoading = false
          render()
        }
      }

      async function pollForResponse() {
        // Poll for new messages after sending
        const startTime = Date.now()
        const timeout = 60000 // 1 minute
        const pollInterval = 1000 // 1 second

        while (Date.now() - startTime < timeout) {
          try {
            const res = await fetch(GC_API + "/chat/messages?sessionId=" + chatSession.id)
            const data = await res.json()
            if (data.messages && Array.isArray(data.messages)) {
              const newMessages = data.messages
                .filter((m) => m.role === "user" || m.role === "assistant")
                .map((m) => ({
                  role: m.role,
                  content: m.content || m.parts?.[0]?.text || "",
                  timestamp: m.time?.created || Date.now(),
                }))

              // Check if there's a new assistant message
              if (newMessages.length > chatMessages.length) {
                chatMessages = newMessages
                render()
                break
              }
            }
          } catch (e) {
            // Ignore polling errors
          }
          await new Promise((r) => setTimeout(r, pollInterval))
        }
      }
